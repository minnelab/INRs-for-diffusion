[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inrs-for-diffusion"
version = "1.0.0"
description = "Implicit neural representations of diffusion MRI with a ball-and-fODF forward model"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["inrdiff", "inrdiff.networks"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
